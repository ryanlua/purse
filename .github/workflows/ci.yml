name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
      - name: Install Wally packages
        run: |
          wally install
          rojo sourcemap purse.project.json --output sourcemap.json
          wally-package-types --sourcemap sourcemap.json Packages/
      - name: Run StyLua
        run: stylua --check src/
      - name: Run selene
        run: selene src/
      - name: Build Rojo project
        run: |
          rojo build model.project.json --output Purse.rbxm
          rojo build model.project.json --output Purse.rbxmx
      - name: Archive build files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Purse
          path: |
            *.rbxm
            *.rbxmx
          if-no-files-found: error