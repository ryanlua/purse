name: Create Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          name: Purse
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.rbxm
            *.rbxmx
          overwrite_files: false
          generate_release_notes: true
      - name: Publish to Wally
        run: |
          wally login --token ${{ secrets.WALLY_AUTH_TOKEN }}
          wally publish
      - name: Publish to Roblox
        uses: ryanlua/update-roblox-asset@v0.1.0
        with:
          api-key: ${{ secrets.OPEN_CLOUD_API_KEY }}
          asset-id: 112061170330936
          file: Purse.rbxm
          display-name: Purse ${{ github.ref_name }}
